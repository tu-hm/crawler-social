[project]
name = "crawler-social"
version = "0.1.0"
description = "Simple, safe crawler for one public Facebook Page (v1)."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "platformdirs>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
crawler = "crawler_social.cli:app"

[build-system]
requires = ["uv_build>=0.7", "uv"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler_social"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
