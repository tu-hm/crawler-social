<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}crawler-social{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">crawler-<span>social</span></a>
      <nav class="site-nav" aria-label="Sections">
        <a href="/posts"{% if nav == "posts" %} class="active"{% endif %}>Posts</a>
        <a href="/runs"{% if nav == "runs" %} class="active"{% endif %}>Runs</a>
        <a href="/snapshots"{% if nav == "snapshots" %} class="active"{% endif %}>Snapshots</a>
        <a href="/crawl"{% if nav == "crawl" %} class="active"{% endif %}>Crawl</a>
      </nav>
      <div class="header-meta">
        <span class="db-path" title="SQLite database file">{{ db_path }}</span>
        {% if last_run %}
        <span class="badge badge-{{ last_run.status }}">{{ last_run.status }}</span>
        {% endif %}
      </div>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>crawler-social v{{ version }}</span>
      <span>{{ total_posts }} posts · {{ total_snapshots }} snapshots · {{ total_runs }} runs</span>
    </div>
  </footer>
</body>
</html>
