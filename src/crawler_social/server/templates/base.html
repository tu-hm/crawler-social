<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# htmx configuration lives in a meta tag, not an inline script: the Step
     09 CSP forbids inline script, and a <meta> is neither script nor style.
     Four defaults are wrong for this server -- see plans/v4/00 D6.
     includeIndicatorStyles: htmx otherwise injects a <style> element.
     historyCacheSize:       0 keeps rendered post text out of sessionStorage.
     allowEval/allowScriptTags: no attribute may ever need unsafe-eval, and
                             swapped markup must never execute a script. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"historyCacheSize":0,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
  <title>{% block title %}crawler-social{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {# app.js runs before Alpine so its alpine:init listener is registered
     when Alpine starts. Deferred scripts execute in document order. #}
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/vendor/alpine-csp.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">crawler-<span>social</span></a>
      <nav class="site-nav" aria-label="Sections">
        {# aria-current tells a screen reader which section it is in; the
           .active class alone only says it visually. #}
        {% for item, label in [("posts", "Posts"), ("runs", "Runs"), ("snapshots", "Snapshots"), ("crawl", "Crawl")] %}
        <a href="/{{ item }}"{% if nav == item %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <div class="header-meta">
        <span class="db-path" title="SQLite database file">{{ db_path }}</span>
        {% if last_run %}
        <span class="badge badge-{{ last_run.status }}">{{ last_run.status }}</span>
        {% endif %}
      </div>
    </div>
  </header>
  <main class="wrap" id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>crawler-social v{{ version }}</span>
      <span>
        {{ total_posts }} post{{ "" if total_posts == 1 else "s" }} ·
        {{ total_snapshots }} snapshot{{ "" if total_snapshots == 1 else "s" }} ·
        {{ total_runs }} run{{ "" if total_runs == 1 else "s" }}
      </span>
    </div>
  </footer>
</body>
</html>
