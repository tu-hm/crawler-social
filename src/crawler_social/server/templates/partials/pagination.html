{% if pagination %}
<nav class="pagination" aria-label="Pagination">
  <span class="page-info">showing {{ pagination.from }}–{{ pagination.to }} of {{ pagination.total }}</span>
  <span class="page-links">
    {% if pagination.prev_url %}
    <a class="button" href="{{ pagination.prev_url }}">← Previous</a>
    {% else %}
    <span class="button disabled">← Previous</span>
    {% endif %}
    {% if pagination.next_url %}
    <a class="button" href="{{ pagination.next_url }}">Next →</a>
    {% else %}
    <span class="button disabled">Next →</span>
    {% endif %}
  </span>
</nav>
{% endif %}
